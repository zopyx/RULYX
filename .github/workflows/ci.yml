name: CI

on:
  push:
    branches: [main, refactor/*]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftFormat
        run: brew install swiftformat swiftlint
      - name: Run lint
        run: make lint

  translations:
    name: Translation Validation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Generate project
        run: make generate
      - name: Validate translations
        run: make translations-validate-ci

  build-and-test:
    name: Build & Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-data-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: derived-data-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      # `make generate` also seeds Config/Secrets.xcconfig from the tracked template: the real
      # file is gitignored (secrets), and xcodegen refuses to run without it.
      - name: Generate project
        run: make generate

      - name: Build
        run: make build

      - name: Run unit tests
        run: make test-ci

      - name: Validate localization keys
        run: make translations-validate-ci
        continue-on-error: true

      - name: Check coverage threshold
        run: python3 scripts/check-coverage.py 50

      - name: Upload to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
