name: Nightly

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

jobs:
  full-test:
    name: Nightly Full Test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: nightly-derived-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: nightly-derived-${{ runner.os }}-

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project RULYX.xcodeproj -scheme RULYX \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            build CODE_SIGNING_ALLOWED=NO

      - name: Run full test suite
        run: |
          xcodebuild -project RULYX.xcodeproj -scheme RULYX \
            -destination 'platform=iOS Simulator,name=iPhone 16 Pro Max' \
            -enableCodeCoverage YES \
            -parallel-testing-enabled YES \
            test CODE_SIGNING_ALLOWED=NO

      - name: Check coverage threshold
        run: python3 scripts/check-coverage.py 50

      - name: Lint
        run: make lint

      - name: Validate translations
        run: make translations-validate-ci

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Nightly build failed — ${new Date().toISOString().split('T')[0]}`,
              body: `Nightly CI run failed. [View run](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              labels: ['bug', 'ci']
            })
